name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            output/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#B96F6B
            output/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#B96F6B

      - name: Push generated files
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: update contribution snake [skip ci]"
          add: "output/*.svg"
