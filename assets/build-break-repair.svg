<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 160" width="100%" height="160">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      .panel-title {
        font-family: 'Cormorant Garamond', 'Canela', Georgia, 'Times New Roman', serif;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.14em;
        fill: #F2F0F7;
      }
      .panel-item {
        font-family: 'JetBrains Mono', monospace, -apple-system, sans-serif;
        font-size: 11.5px;
        font-weight: 400;
        letter-spacing: 0.08em;
        fill: #A7A3B5;
      }
      .panel-dot {
        fill: #B8A4FF;
      }
      .arrow {
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        fill: #8F82C7;
        opacity: 0.6;
        text-anchor: middle;
      }
    </style>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11131A" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#08090D" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(184, 164, 255, 0.25)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(184, 164, 255, 0.15)" />
    </linearGradient>
  </defs>

  <!-- Panel 1: BUILD -->
  <g transform="translate(10, 10)">
    <rect width="250" height="140" rx="10" fill="url(#panelGrad)" stroke="url(#borderGrad)" stroke-width="1" />
    <circle cx="28" cy="36" r="3.5" class="panel-dot" />
    <text x="42" y="42" class="panel-title">BUILD</text>
    <line x1="28" y1="58" x2="222" y2="58" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    <text x="28" y="82" class="panel-item"><tspan fill="#8F82C7">01</tspan>  Idea Formulation</text>
    <text x="28" y="104" class="panel-item"><tspan fill="#8F82C7">02</tspan>  Clean Architecture</text>
    <text x="28" y="126" class="panel-item"><tspan fill="#8F82C7">03</tspan>  Ship &amp; Create</text>
  </g>

  <!-- Connector 1 -->
  <text x="285" y="86" class="arrow">→</text>

  <!-- Panel 2: BREAK -->
  <g transform="translate(300, 10)">
    <rect width="250" height="140" rx="10" fill="url(#panelGrad)" stroke="url(#borderGrad)" stroke-width="1" />
    <circle cx="28" cy="36" r="3.5" class="panel-dot" />
    <text x="42" y="42" class="panel-title">BREAK</text>
    <line x1="28" y1="58" x2="222" y2="58" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    <text x="28" y="82" class="panel-item"><tspan fill="#8F82C7">01</tspan>  Stress &amp; Edge Cases</text>
    <text x="28" y="104" class="panel-item"><tspan fill="#8F82C7">02</tspan>  Runtime Failures</text>
    <text x="28" y="126" class="panel-item"><tspan fill="#8F82C7">03</tspan>  Expose Weaknesses</text>
  </g>

  <!-- Connector 2 -->
  <text x="575" y="86" class="arrow">→</text>

  <!-- Panel 3: REPAIR -->
  <g transform="translate(590, 10)">
    <rect width="250" height="140" rx="10" fill="url(#panelGrad)" stroke="url(#borderGrad)" stroke-width="1" />
    <circle cx="28" cy="36" r="3.5" class="panel-dot" />
    <text x="42" y="42" class="panel-title">REPAIR</text>
    <line x1="28" y1="58" x2="222" y2="58" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    <text x="28" y="82" class="panel-item"><tspan fill="#8F82C7">01</tspan>  Root Cause Debug</text>
    <text x="28" y="104" class="panel-item"><tspan fill="#8F82C7">02</tspan>  Understand &amp; Learn</text>
    <text x="28" y="126" class="panel-item"><tspan fill="#8F82C7">03</tspan>  Refactor &amp; Improve</text>
  </g>
</svg>
