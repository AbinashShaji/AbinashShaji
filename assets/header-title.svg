<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 110" width="100%" height="110">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      .title {
        font-family: 'Cormorant Garamond', 'Canela', Georgia, 'Times New Roman', serif;
        font-size: 38px;
        font-weight: 600;
        letter-spacing: 0.18em;
        fill: #F2F0F7;
        text-anchor: middle;
      }
      .subtitle {
        font-family: 'JetBrains Mono', monospace, -apple-system, sans-serif;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.28em;
        fill: #A7A3B5;
        text-anchor: middle;
      }
      .accent {
        fill: #B8A4FF;
      }
    </style>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(184, 164, 255, 0)" />
      <stop offset="25%" stop-color="rgba(184, 164, 255, 0.4)" />
      <stop offset="50%" stop-color="rgba(184, 164, 255, 0.8)" />
      <stop offset="75%" stop-color="rgba(184, 164, 255, 0.4)" />
      <stop offset="100%" stop-color="rgba(184, 164, 255, 0)" />
    </linearGradient>
  </defs>
  
  <text x="425" y="46" class="title">ABINASH SHAJI</text>
  <line x1="280" y1="64" x2="570" y2="64" stroke="url(#lineGrad)" stroke-width="1" />
  <text x="425" y="86" class="subtitle">MCA STUDENT <tspan class="accent">·</tspan> DEVELOPER <tspan class="accent">·</tspan> BUILDER</text>
</svg>
